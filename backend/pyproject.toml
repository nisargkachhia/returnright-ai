[project]
name = "returnright-backend"
version = "0.1.0"
description = "ReturnRight AI backend — FastAPI + MCP Streamable HTTP"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.32.0,<1.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "sqlalchemy>=2.0.36,<3.0",
  "alembic>=1.14.0,<2.0",
  "mcp>=2.3.0,<3.0",
  "httpx>=0.27.0,<1.0",
  "python-dotenv>=1.0.0,<2.0",
  "structlog>=24.4.0,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
  "anyio>=4.6.0,<5.0",
  "ruff>=0.8.0,<1.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
